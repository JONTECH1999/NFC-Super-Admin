<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Linda Johnson - Sr. Marketing Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter & Playfair for stylized logo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Alex+Brush&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b1120;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Desktop Viewport Background */
        .app-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #17223b 0%, #080d1a 100%);
            padding: 16px;
        }

        /* Phone Device Mockup Container */
        .phone-container {
            width: 100%;
            max-width: 380px;
            height: 100%;
            max-height: 820px;
            position: relative;
            margin: auto;
            display: flex;
            flex-direction: column;
            border-radius: 44px;
            background-color: #f8fafc;
            box-shadow: 
                0 0 0 9px #1a1a1a,
                0 0 0 11px rgba(255, 255, 255, 0.15),
                0 25px 50px 15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Mobile Full-Bleed Overrides */
        @media (max-width: 480px) {
            .app-viewport {
                padding: 0 !important;
                background: #f8fafc !important;
            }

            .phone-container {
                max-width: 100% !important;
                max-height: 100% !important;
                height: 100dvh !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }

            .phone-notch {
                display: none !important;
            }
        }

        /* Phone Top Notch Bar */
        .phone-notch {
            width: 100%;
            height: 28px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .notch-bar {
            width: 110px;
            height: 16px;
            background-color: #1a1a1a;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
        }

        .notch-speaker {
            width: 36px;
            height: 3px;
            background-color: #333333;
            border-radius: 2px;
        }

        .notch-camera {
            width: 7px;
            height: 7px;
            background-color: #0d1527;
            border-radius: 50%;
        }

        /* Header Image & Curve Wave Container */
        .header-photo-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
            background-color: #e2e8f0;
            flex-shrink: 0;
        }

        .header-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
        }

        /* Curved S-Wave Divider SVG */
        .wave-divider {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            line-height: 0;
            z-index: 10;
        }

        .wave-svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 80px;
        }

        /* Dark Navy Circular Badge Logo */
        .navy-logo-badge {
            position: absolute;
            right: 22px;
            bottom: 6px;
            z-index: 20;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #0b1938;
            box-shadow: 0 6px 16px rgba(11, 25, 56, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
        }

        .logo-script-a {
            font-family: 'Alex Brush', cursive;
            font-size: 46px;
            color: #ffffff;
            line-height: 1;
            margin-top: -4px;
            margin-left: -2px;
            transform: rotate(-5deg);
        }

        /* Coral-Red Action Circle Buttons */
        .coral-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #f04452;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow: 0 4px 12px rgba(240, 68, 82, 0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
        }

        .coral-btn:hover {
            transform: scale(1.08);
            background-color: #e03341;
        }

        .coral-btn:active {
            transform: scale(0.95);
        }

        /* Social Link Card Style */
        .social-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .social-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        /* Floating Bottom Bar */
        .floating-bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .bottom-circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #0b1938;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 6px 18px rgba(11, 25, 56, 0.35);
            transition: transform 0.2s ease, background-color 0.2s ease;
            flex-shrink: 0;
        }

        .bottom-circle-btn:hover {
            transform: scale(1.05);
            background-color: #142752;
        }

        .bottom-circle-btn:active {
            transform: scale(0.95);
        }

        .add-contact-btn {
            height: 48px;
            flex: 1;
            border-radius: 28px;
            background-color: #0b1938;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(11, 25, 56, 0.35);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .add-contact-btn:hover {
            transform: scale(1.02);
            background-color: #142752;
        }

        .add-contact-btn:active {
            transform: scale(0.98);
        }

        /* Scrollbar Styling */
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }
    </style>
</head>
<body class="select-none">

    <!-- MAIN VIEWPORT WRAPPER -->
    <div class="app-viewport">

        <!-- SMARTPHONE DEVICE MOCKUP FRAME -->
        <div class="phone-container">

            <!-- Top Camera & Speaker Notch -->
            <div class="phone-notch">
                <div class="notch-bar">
                    <div class="notch-speaker"></div>
                    <div class="notch-camera"></div>
                </div>
            </div>

            <!-- SCROLLABLE INNER CARD CONTENT -->
            <div class="flex-1 overflow-y-auto scroll-content relative bg-[#f8fafc] pb-24">
                
                <!-- TOP HEADER PHOTO & WAVE DIVIDER -->
                <div class="header-photo-wrapper">
                    <!-- Linda Johnson Portrait Photo -->
                    <img src="https://images.unsplash.com/photo-1580894732444-8ecded7900cd?auto=format&fit=crop&q=80&w=600&h=700" 
                         alt="Linda Johnson" 
                         onerror="this.src='https://placehold.co/600x700/0b1938/ffffff?text=Linda+Johnson';"
                         class="header-photo">

                    <!-- Red & White Curved Wave Pattern -->
                    <div class="wave-divider">
                        <svg class="wave-svg" viewBox="0 0 500 120" preserveAspectRatio="none">
                            <!-- Curved Red Accent Ribbon -->
                            <path d="M 0,40 C 180,105 320,-10 500,38 L 500,120 L 0,120 Z" fill="#f04452"></path>
                            <!-- Main White Background Overlay -->
                            <path d="M 0,58 C 190,120 310,12 500,52 L 500,120 L 0,120 Z" fill="#f8fafc"></path>
                        </svg>

                        <!-- Stylized White 'A' Logo Navy Badge -->
                        <div class="navy-logo-badge">
                            <span class="logo-script-a">A</span>
                        </div>
                    </div>
                </div>

                <!-- PROFILE INFO & NAME SECTION -->
                <div class="px-6 pt-1">
                    <h1 class="text-2xl font-extrabold text-[#0b1938] tracking-tight">
                        Linda Johnson
                    </h1>
                    <p class="text-xs font-semibold text-gray-500 mt-1">
                        Sr. Marketing Manager
                    </p>

                    <!-- QUICK ACTION CORAL BUTTONS ROW -->
                    <div class="flex items-center space-x-3.5 mt-5">
                        <!-- Phone / Call -->
                        <a href="tel:+12345678901" onclick="handleQuickAction(event, 'Phone')" class="coral-btn" title="Call Linda">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </a>

                        <!-- Email -->
                        <a href="mailto:linda.johnson@company.com" onclick="handleQuickAction(event, 'Email')" class="coral-btn" title="Send Email">
                            <i class="fa-regular fa-envelope"></i>
                        </a>

                        <!-- Message / SMS -->
                        <a href="sms:+12345678901" onclick="handleQuickAction(event, 'SMS')" class="coral-btn" title="Send Message">
                            <i class="fa-regular fa-comment-dots"></i>
                        </a>

                        <!-- WhatsApp -->
                        <a href="https://wa.me/12345678901" onclick="handleQuickAction(event, 'WhatsApp')" class="coral-btn" title="WhatsApp Chat">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </a>
                    </div>
                </div>

                <!-- SOCIAL LINK CARDS LIST -->
                <div class="px-6 mt-7 space-y-3.5">
                    
                    <!-- Facebook Card -->
                    <div class="social-card cursor-pointer group" onclick="openLink('Facebook', 'https://facebook.com')">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-full bg-[#1877f2] text-white flex items-center justify-center text-xl shrink-0 shadow-sm">
                                <i class="fa-brands fa-facebook-f"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-gray-800 group-hover:text-[#1877f2] transition-colors">Facebook</span>
                                <span class="text-[10px] font-medium text-gray-400">Like us on Facebook</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-[#f04452] transition-transform group-hover:translate-x-1"></i>
                    </div>

                    <!-- Instagram Card -->
                    <div class="social-card cursor-pointer group" onclick="openLink('Instagram', 'https://instagram.com')">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-full text-white flex items-center justify-center text-xl shrink-0 shadow-sm"
                                 style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);">
                                <i class="fa-brands fa-instagram"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-gray-800 group-hover:text-[#d6249f] transition-colors">Instagram</span>
                                <span class="text-[10px] font-medium text-gray-400">Follow us on Instagram</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-[#f04452] transition-transform group-hover:translate-x-1"></i>
                    </div>

                    <!-- LinkedIn Card -->
                    <div class="social-card cursor-pointer group" onclick="openLink('LinkedIn', 'https://linkedin.com')">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-full bg-[#0a66c2] text-white flex items-center justify-center text-lg shrink-0 shadow-sm">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-gray-800 group-hover:text-[#0a66c2] transition-colors">LinkedIn</span>
                                <span class="text-[10px] font-medium text-gray-400">Connect on LinkedIn</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-[#f04452] transition-transform group-hover:translate-x-1"></i>
                    </div>

                </div>

            </div>

            <!-- FLOATING BOTTOM NAVIGATION BAR -->
            <div class="floating-bottom-bar">
                
                <!-- QR Code Modal Trigger Button -->
                <button onclick="toggleQRModal(true)" class="bottom-circle-btn" title="Show QR Code">
                    <i class="fa-solid fa-qrcode"></i>
                </button>

                <!-- Share Button -->
                <button onclick="shareCard()" class="bottom-circle-btn" title="Share Digital Card">
                    <i class="fa-solid fa-arrow-up-from-bracket text-base"></i>
                </button>

                <!-- Add to Contact Action Button -->
                <button onclick="downloadVCard()" class="add-contact-btn">
                    <span>Add to Contact</span>
                    <div class="w-6 h-6 rounded-full border-1.5 border-white/80 flex items-center justify-center">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </div>
                </button>

            </div>

        </div>

    </div>

    <!-- QR CODE MODAL POPUP -->
    <div id="qr-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="qr-modal-card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-gray-900">Scan QR Code</h3>
                <button onclick="toggleQRModal(false)" class="text-gray-400 hover:text-gray-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- SVG Simulated QR Code -->
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex items-center justify-center my-2">
                <svg width="180" height="180" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" fill="white"/>
                    <!-- Position Patterns -->
                    <rect x="10" y="10" width="25" height="25" rx="4" fill="#0b1938"/>
                    <rect x="15" y="15" width="15" height="15" rx="2" fill="white"/>
                    <rect x="18" y="18" width="9" height="9" fill="#0b1938"/>

                    <rect x="65" y="10" width="25" height="25" rx="4" fill="#0b1938"/>
                    <rect x="70" y="15" width="15" height="15" rx="2" fill="white"/>
                    <rect x="73" y="18" width="9" height="9" fill="#0b1938"/>

                    <rect x="10" y="65" width="25" height="25" rx="4" fill="#0b1938"/>
                    <rect x="15" y="70" width="15" height="15" rx="2" fill="white"/>
                    <rect x="18" y="73" width="9" height="9" fill="#0b1938"/>

                    <!-- Random Modules -->
                    <rect x="42" y="10" width="6" height="6" fill="#f04452"/>
                    <rect x="50" y="18" width="6" height="6" fill="#0b1938"/>
                    <rect x="42" y="26" width="6" height="6" fill="#0b1938"/>
                    <rect x="10" y="42" width="6" height="6" fill="#0b1938"/>
                    <rect x="18" y="50" width="6" height="6" fill="#f04452"/>
                    <rect x="26" y="42" width="6" height="6" fill="#0b1938"/>
                    <rect x="42" y="42" width="16" height="16" rx="3" fill="#0b1938"/>
                    <rect x="65" y="42" width="6" height="6" fill="#0b1938"/>
                    <rect x="73" y="50" width="6" height="6" fill="#f04452"/>
                    <rect x="81" y="42" width="6" height="6" fill="#0b1938"/>
                    <rect x="42" y="65" width="6" height="6" fill="#0b1938"/>
                    <rect x="50" y="73" width="6" height="6" fill="#0b1938"/>
                    <rect x="65" y="65" width="12" height="6" fill="#0b1938"/>
                    <rect x="81" y="73" width="6" height="12" fill="#f04452"/>
                    <rect x="65" y="81" width="6" height="6" fill="#0b1938"/>
                </svg>
            </div>
            <p class="text-xs text-gray-500 font-medium mt-3">Scan to instantly open Linda's digital card</p>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2.5 border border-gray-700/60">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        // Toast Notification Trigger
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2300);
        }

        // Quick Action Click Handler
        function handleQuickAction(e, type) {
            showToast(`Opening ${type}...`);
        }

        // Social Link Click Handler
        function openLink(name, url) {
            showToast(`Opening ${name}...`);
            setTimeout(() => {
                window.open(url, '_blank');
            }, 400);
        }

        // Toggle QR Code Modal
        function toggleQRModal(show) {
            const modal = document.getElementById('qr-modal');
            const modalCard = document.getElementById('qr-modal-card');
            if (show) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modalCard.classList.remove('scale-90');
                modalCard.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modalCard.classList.remove('scale-100');
                modalCard.classList.add('scale-90');
            }
        }

        // Native Web Share or Clipboard Fallback
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'Linda Johnson - Digital Card',
                    text: 'Connect with Linda Johnson, Sr. Marketing Manager.',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = window.location.href;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Digital Card link copied!');
                } catch (err) {
                    showToast('Failed to copy link');
                } finally {
                    document.body.removeChild(textarea);
                }
            }
        }

        // vCard Generator & Downloader (.vcf)
        function downloadVCard() {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'FN:Linda Johnson',
                'N:Johnson;Linda;;;',
                'TITLE:Sr. Marketing Manager',
                'TEL;TYPE=WORK,VOICE:+12345678901',
                'EMAIL;TYPE=WORK:linda.johnson@company.com',
                'NOTE:Sr. Marketing Manager. Connect on WhatsApp and Socials.',
                'END:VCARD'
            ].join('\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Linda_Johnson.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);

            showToast('Saved Linda Johnson to contacts!');
        }
    </script>
</body>
</html>
